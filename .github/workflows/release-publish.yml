name: Publish signed release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful release source run ID
        required: true
        type: string

permissions: {}

concurrency:
  group: epilogue-release-publisher-${{ inputs.build_run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Reject reruns
        if: ${{ github.run_attempt != 1 }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Download source request records and Linux packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: source-*
          merge-multiple: true
          path: ${{ runner.temp }}/epilogue-source-files
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Poll signing center and assemble verified release assets
        id: assemble
        env:
          SIGNING_API_KEY: ${{ secrets.SIGNING_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_BUILD_RUN_ID: ${{ inputs.build_run_id }}
          INPUT_CONTEXT_DIR: ${{ runner.temp }}/epilogue-source-files
          INPUT_OUTPUT_DIR: ${{ runner.temp }}/epilogue-release-assets
        run: node scripts/release-signing.mjs publish
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/epilogue-release-assets/*
      - name: Publish release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ steps.assemble.outputs.release_tag }}
          files: ${{ runner.temp }}/epilogue-release-assets/*
          fail_on_unmatched_files: true
          draft: false
          generate_release_notes: false
      - name: Wipe release workspaces
        if: always()
        run: rm -rf "$RUNNER_TEMP/epilogue-source-files" "$RUNNER_TEMP/epilogue-release-assets"
