name: Release

# 推送 v* 标签时自动构建全平台发布包并上传到 GitHub Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

# 2026-06-16 起 runner 强制 Node 24，提前显式启用消除弃用警告；
# onnxruntime-node 在 linux x64 的 postinstall 会下载 ~340MB CUDA/TensorRT 二进制 —— 跳过
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  build:
    strategy:
      fail-fast: false
      # 每个受支持目标使用原生架构 runner，npm ci 安装匹配的原生模块（sharp/onnxruntime）。
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
          # onnxruntime-node 1.24+ no longer ships macOS x64 binaries. Do not
          # publish an Intel package that fails when local embeddings load.
          - os: windows-latest
            platform: win32
            arch: x64
          - os: windows-11-arm
            platform: win32
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ !(matrix.platform == 'win32' && matrix.arch == 'arm64') }}
        shell: bash
        # Windows runner 偶发 EPERM 文件锁（杀软/索引），重试一次即过
        run: npm ci --no-audit --no-fund || npm ci --no-audit --no-fund

      - name: Install dependencies (win-arm64)
        if: ${{ matrix.platform == 'win32' && matrix.arch == 'arm64' }}
        shell: bash
        # ffmpeg-static 无 win-arm64 二进制：跳过 install scripts（electron 二进制由 packager 自下载、
        # 测试为纯 node），再以 x64 重装 ffmpeg —— ARM Windows 模拟运行 x64 exe，功能完整
        run: |
          (npm ci --no-audit --no-fund --ignore-scripts || npm ci --no-audit --no-fund --ignore-scripts)
          npm_config_arch=x64 npm rebuild ffmpeg-static

      - name: Run tests
        run: npm test

      - name: Package
        shell: bash
        run: bash scripts/pack.sh ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Installer (macOS dmg)
        if: matrix.platform == 'darwin'
        run: |
          mkdir -p dist/installers dmg-root
          cp -R "dist/Epilogue-darwin-${{ matrix.arch }}/Epilogue.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname Epilogue -srcfolder dmg-root -ov -format UDZO \
            "dist/installers/Epilogue-${{ github.ref_name }}-darwin-${{ matrix.arch }}.dmg"

      # 安装器工具按平台 job 内按需安装（electron-installer-debian 声明仅 darwin/linux，
      # 放 devDependencies 会让 Windows 的 npm ci 直接 EBADPLATFORM）
      - name: Installer (Windows Setup.exe)
        if: matrix.platform == 'win32'
        shell: bash
        run: |
          npm i --no-save --no-package-lock electron-winstaller@5.4.4
          node scripts/installer-win.js ${{ matrix.arch }} ${{ github.ref_name }}

      - name: Installer (Linux deb)
        if: matrix.platform == 'linux'
        run: |
          npm i --no-save --no-package-lock electron-installer-debian@4.0.0
          node scripts/installer-linux.js ${{ matrix.arch }} ${{ github.ref_name }}

      - name: Resolve release asset and generate SHA-256
        shell: bash
        run: |
          shopt -s nullglob
          assets=(dist/installers/Epilogue-${GITHUB_REF_NAME}-${{ matrix.platform }}-${{ matrix.arch }}*)
          if [ "${#assets[@]}" -ne 1 ]; then
            echo "Expected exactly one release asset, found ${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          echo "RELEASE_ASSET=${assets[0]}" >> "$GITHUB_ENV"
          node scripts/checksum.js "${assets[0]}"

      - name: Attest release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.RELEASE_ASSET }}

      - name: Upload to Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          files: |
            ${{ env.RELEASE_ASSET }}
            ${{ env.RELEASE_ASSET }}.sha256
          fail_on_unmatched_files: true
          draft: false
          # 各并发 job 自行上传资产；发布说明由发布者撰写，CI 不生成不覆盖
          generate_release_notes: false
