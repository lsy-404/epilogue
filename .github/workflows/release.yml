name: Release source builds

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  macos-build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Validate stable release version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${GITHUB_REF_NAME#v}" == "$(node -p "require('./package.json').version")" ]]
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run existing checks
        run: pnpm test
      - name: Package application
        run: bash scripts/pack.sh darwin arm64
      - name: Preserve macOS app metadata and permissions
        run: tar -czf dist/Epilogue-darwin-arm64-app.tar.gz -C dist/Epilogue-darwin-arm64 Epilogue.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-app-macos-arm64
          path: dist/Epilogue-darwin-arm64-app.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows-build-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Validate stable release version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${GITHUB_REF_NAME#v}" == "$(node -p "require('./package.json').version")" ]]
      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile || pnpm install --frozen-lockfile
      - name: Run existing checks
        run: pnpm test
      - name: Package application
        shell: bash
        run: bash scripts/pack.sh win32 x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-app-windows-x64
          path: dist/Epilogue-win32-x64
          if-no-files-found: error
          retention-days: 7

  windows-build-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Validate stable release version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${GITHUB_REF_NAME#v}" == "$(node -p "require('./package.json').version")" ]]
      - name: Install dependencies (Windows ARM64)
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts || pnpm install --frozen-lockfile --ignore-scripts
          npm_config_arch=x64 pnpm rebuild ffmpeg-static
      - name: Run existing checks
        run: pnpm test
      - name: Package application
        shell: bash
        run: bash scripts/pack.sh win32 arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-app-windows-arm64
          path: dist/Epilogue-win32-arm64
          if-no-files-found: error
          retention-days: 7

  linux-build:
    name: linux-build-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Validate stable release version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${GITHUB_REF_NAME#v}" == "$(node -p "require('./package.json').version")" ]]
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run existing checks
        run: pnpm test
      - name: Package application
        run: bash scripts/pack.sh linux ${{ matrix.arch }}
      - name: Create Debian package
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/epilogue-linux-installer"
          mkdir -p "$tool_dir"
          cat > "$tool_dir/package.json" <<'EOF'
          {"name":"epilogue-release-tools","private":true,"pnpm":{"onlyBuiltDependencies":["electron-installer-debian"]}}
          EOF
          pnpm --dir "$tool_dir" add --save-exact electron-installer-debian@4.0.0
          NODE_PATH="$tool_dir/node_modules" node scripts/installer-linux.js ${{ matrix.arch }} "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-linux-${{ matrix.arch }}
          path: dist/installers/*.deb
          if-no-files-found: error
          retention-days: 7

  macos-source:
    name: macos-source
    needs: [macos-build, windows-build-x64, windows-build-arm64, linux-build]
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-app-macos-arm64
          path: ${{ runner.temp }}/epilogue-app
      - name: Restore packaged app
        run: |
          mkdir -p dist/Epilogue-darwin-arm64
          tar -xzf "$RUNNER_TEMP/epilogue-app/Epilogue-darwin-arm64-app.tar.gz" -C dist/Epilogue-darwin-arm64
      - name: Submit macOS source to signing center
        env:
          SIGNING_API_KEY: ${{ secrets.SIGNING_API_KEY }}
          INPUT_PLATFORM: macos
          INPUT_ARCHITECTURE: arm64
          INPUT_SOURCE_SHA: ${{ github.sha }}
          INPUT_CONTEXT_DIR: ${{ runner.temp }}/epilogue-release-context
        shell: bash
        run: |
          export INPUT_VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-signing.mjs source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-macos-arm64
          path: ${{ runner.temp }}/epilogue-release-context/request-epilogue-macos-arm64.json
          if-no-files-found: error
          retention-days: 7

  windows-source-x64:
    name: windows-source-x64
    needs: [macos-build, windows-build-x64, windows-build-arm64, linux-build]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-app-windows-x64
          path: dist/Epilogue-win32-x64
      - name: Submit Windows x64 source to signing center
        env:
          SIGNING_API_KEY: ${{ secrets.SIGNING_API_KEY }}
          INPUT_PLATFORM: windows
          INPUT_ARCHITECTURE: x64
          INPUT_SOURCE_SHA: ${{ github.sha }}
          INPUT_CONTEXT_DIR: ${{ runner.temp }}/epilogue-release-context
        shell: bash
        run: |
          export INPUT_VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-signing.mjs source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-windows-x64
          path: ${{ runner.temp }}/epilogue-release-context/request-epilogue-windows-x64.json
          if-no-files-found: error
          retention-days: 7

  windows-source-arm64:
    name: windows-source-arm64
    needs: [macos-build, windows-build-x64, windows-build-arm64, linux-build]
    runs-on: windows-11-arm
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-app-windows-arm64
          path: dist/Epilogue-win32-arm64
      - name: Submit Windows ARM64 source to signing center
        env:
          SIGNING_API_KEY: ${{ secrets.SIGNING_API_KEY }}
          INPUT_PLATFORM: windows
          INPUT_ARCHITECTURE: arm64
          INPUT_SOURCE_SHA: ${{ github.sha }}
          INPUT_CONTEXT_DIR: ${{ runner.temp }}/epilogue-release-context
        shell: bash
        run: |
          export INPUT_VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-signing.mjs source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-windows-arm64
          path: ${{ runner.temp }}/epilogue-release-context/request-epilogue-windows-arm64.json
          if-no-files-found: error
          retention-days: 7
