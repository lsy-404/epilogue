name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify public package dependencies
        run: node test/public-model-auth.test.mjs
      - name: Run tests
        run: pnpm test
      - name: Verify quick search in Electron
        run: xvfb-run -a node test/quick-search-smoke.cjs
      - name: Package Linux x64
        run: bash scripts/pack.sh linux x64
      - name: Verify packaged runtime
        run: xvfb-run -a node test/packaged-runtime-smoke.cjs
